<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Speech Coach">
  <title>Speech Coach</title>
  <link rel="icon" href="icons/icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // A saved Dark or Light theme applies before the first paint, so the page never shows the
    // device scheme first; app.js applies it again at boot to point the theme-color metas.
    (function () {
      "use strict";
      try {
        const theme = localStorage.getItem("speech-coach-theme");
        if (theme === "dark" || theme === "light") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {
        // Blocked storage leaves the device setting in charge, as Auto does.
      }
    })();
  </script>
</head>
<body>
  <main>
    <section class="screen" id="screen-onboarding" hidden>
      <h1>Speech Coach</h1>
      <div class="screen__body"></div>
    </section>
    <section class="screen" id="screen-practice" data-state="idle" hidden>
      <header class="screen__header">
        <h1>Practice</h1>
        <span class="wordmark">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
            <path d="M19 11a7 7 0 0 1-14 0"></path>
            <line x1="12" y1="18" x2="12" y2="22"></line>
            <line x1="8" y1="22" x2="16" y2="22"></line>
          </svg>
          Speech Coach
        </span>
        <button class="icon-btn theme-toggle" type="button"></button>
      </header>
      <div class="screen__body"></div>
    </section>
    <section class="screen" id="screen-results" hidden>
      <h1>Results</h1>
      <div class="screen__body"></div>
    </section>
    <section class="screen" id="screen-history" hidden>
      <h1>History</h1>
      <div class="screen__body"></div>
    </section>
    <section class="screen" id="screen-progress" hidden>
      <h1>Progress</h1>
      <div class="screen__body"></div>
    </section>
    <section class="screen" id="screen-path" hidden>
      <h1>Path</h1>
      <div class="screen__body"></div>
    </section>
    <section class="screen" id="screen-level" hidden>
      <h1>Level</h1>
      <div class="screen__body"></div>
    </section>
  </main>
  <div class="sr-only" id="live" aria-live="polite"></div>
  <nav class="nav" aria-label="Main">
    <a class="nav__item" href="#/practice">
      <svg class="nav__icon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
        <path d="M19 11a7 7 0 0 1-14 0"></path>
        <line x1="12" y1="18" x2="12" y2="22"></line>
        <line x1="8" y1="22" x2="16" y2="22"></line>
      </svg>
      <span class="nav__label">Practice</span>
    </a>
    <a class="nav__item" href="#/path">
      <svg class="nav__icon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round">
        <circle cx="6" cy="19" r="3"></circle>
        <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"></path>
        <circle cx="18" cy="5" r="3"></circle>
      </svg>
      <span class="nav__label">Path</span>
    </a>
    <a class="nav__item" href="#/progress">
      <svg class="nav__icon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round">
        <polyline points="3 17 9 11 13 15 21 7"></polyline>
        <polyline points="15 7 21 7 21 13"></polyline>
      </svg>
      <span class="nav__label">Progress</span>
    </a>
    <a class="nav__item" href="#/history">
      <svg class="nav__icon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
      <span class="nav__label">History</span>
    </a>
  </nav>
  <script src="app.js"></script>
  <script src="ui.js"></script>
  <script src="store.js"></script>
  <script src="api.js"></script>
  <script src="passages.js"></script>
  <script src="delivery.js"></script>
  <script src="rank.js"></script>
  <script src="rankcard.js"></script>
  <script src="path.js"></script>
  <script src="loop.js"></script>
  <script src="coach.js"></script>
  <script src="nextmove.js"></script>
  <script src="tips.js"></script>
  <script src="pauses.js"></script>
  <script src="screens/practice.js"></script>
  <script src="screens/results.js"></script>
  <script src="screens/history.js"></script>
  <script src="screens/progress.js"></script>
  <script src="screens/path.js"></script>
  <script src="screens/level.js"></script>
  <script src="screens/onboarding.js"></script>
</body>
</html>
